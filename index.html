<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15372d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Kalah 1.0</title>
</head>
<body>
  <header class="topbar">
    <h1>Kalah <span>1.0</span></h1>
    <div class="top-actions"><label><span data-i18n="language">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label><button id="settings" data-i18n="settings">Настройки</button></div>
  </header>
  <main class="app-main">
    <section id="setup" class="panel setup">
      <h2 data-i18n="newGame">Новая игра</h2>
      <div class="form-grid">
        <label><span data-i18n="mode">Режим</span><select id="mode"><option value="pvp" data-i18n="pvp">Человек против человека</option><option value="ai" data-i18n="ai">Человек против AI</option></select></label>
        <label><span data-i18n="player1">Игрок 1</span><input id="player1" maxlength="32" value="Игрок 1"></label>
        <label id="player2-wrap"><span data-i18n="player2">Игрок 2</span><input id="player2" maxlength="32" value="Игрок 2"></label>
        <label id="difficulty-wrap" hidden><span data-i18n="difficulty">Сложность AI</span><select id="difficulty"><option value="random" data-i18n="randomAI">Случайный</option><option value="easy" data-i18n="easy">Лёгкий</option><option value="hard" data-i18n="hard">Сложный</option><option value="advanced" data-i18n="advanced">Усложнённый</option></select></label>
        <label><span data-i18n="first">Первым ходит</span><select id="first"><option value="1" data-i18n="player1">Игрок 1</option><option value="2" data-i18n="player2">Игрок 2</option><option value="random" data-i18n="random">Случайно</option></select></label>
        <label class="check"><input id="opening" type="checkbox"><span data-i18n="opening">Запретить стартовый ход сразу в калах</span></label>
      </div>
      <button id="start" class="primary" data-i18n="start">Начать игру</button>
    </section>
    <section id="game-area" class="game-screen" hidden>
      <div class="game-head game-summary"><div id="status" class="turn-status" role="status" aria-live="polite" data-effect-anchor="turn"></div><div id="score" class="scoreline"></div></div>
      <section class="board" aria-label="Kalah board" data-animation-surface="board">
        <div id="top-store" class="store top-store" data-effect-anchor="store">
          <div class="store-meta"><span id="top-store-name"></span><strong id="top-store-count">0</strong></div>
          <div id="top-store-seeds" class="seed-cloud store-seeds" aria-hidden="true"></div>
          <button id="top-resign" class="resign-button danger" hidden></button>
        </div>
        <div class="pit-columns board-grid"><div id="left-pits" class="pits left"></div><div id="right-pits" class="pits right"></div></div>
        <div id="bottom-store" class="store bottom-store" data-effect-anchor="store">
          <div class="store-meta"><span id="bottom-store-name"></span><strong id="bottom-store-count">0</strong></div>
          <div id="bottom-store-seeds" class="seed-cloud store-seeds" aria-hidden="true"></div>
          <button id="bottom-resign" class="resign-button danger" hidden></button>
        </div>
      </section>
      <div class="actions game-actions"><button id="save" data-i18n="save">Сохранить</button><button id="load" data-i18n="load">Загрузить</button><button id="rules" data-i18n="rules">Правила</button><button id="statistics" data-i18n="statistics">Статистика</button><button id="new-game" data-i18n="newGame">Новая игра</button></div>
    </section>
  </main>
  <dialog id="modal" class="app-dialog"><section id="modal-content"></section><form method="dialog"><button id="modal-action" type="button" data-i18n="close">Закрыть</button></form></dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
